<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Student Portal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card premium-auth">
      <div class="brand-pill brand-pill-center">Northstar Academy</div>
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to continue to your portal.</p>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="loginEmail" required />

        <label>Password</label>
        <input type="password" id="loginPassword" required />

        <button type="submit">Login</button>
      </form>
      <p class="switch-link">Need an account? <a href="register.html">Register</a></p>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
