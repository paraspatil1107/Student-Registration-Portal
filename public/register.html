<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Student Portal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="css/shared.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card premium-auth">
      <div class="brand-pill brand-pill-center">Northstar Academy</div>
      <h2>Create account</h2>
      <p class="auth-subtitle">Set up your academic profile in minutes.</p>
      <form id="registerForm">
        <label for="registerName">Name</label>
        <input type="text" id="registerName" autocomplete="name" minlength="2" maxlength="60" required />

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" autocomplete="email" required />

        <label for="registerPassword">Password</label>
        <input
          type="password"
          id="registerPassword"
          autocomplete="new-password"
          minlength="8"
          pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
          title="At least 8 characters, with a letter and a number"
          aria-describedby="passwordHint"
          required
        />
        <p class="form-hint" id="passwordHint">At least 8 characters, with a letter and a number.</p>

        <button type="submit">Create account</button>
      </form>
      <p class="switch-link">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
